name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the macOS leg can be skipped. Only a pull request whose complete, verified file
  # list is exactly README.md skips it; every other event or doubtful answer runs macOS.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
    steps:
      - name: Decide whether macOS must run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          decide() { echo "macos=$1" >> "$GITHUB_OUTPUT"; echo "macOS: $1 ($2)"; }
          if [ "${EVENT_NAME}" != "pull_request" ]; then decide true "not a pull request"; exit 0; fi
          if ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"; then
            decide true "file list unavailable"; exit 0
          fi
          listed="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | wc -l)" || listed=-1
          if [ -z "${files}" ] || [ "${listed}" != "${PR_CHANGED_FILES}" ]; then
            decide true "file list empty or incomplete"; exit 0
          fi
          if [ -n "$(printf '%s\n' "${files}" | grep -vx 'README.md' || true)" ]; then
            decide true "files other than README.md changed"; exit 0
          fi
          decide false "only README.md changed"

  just-check:
    name: just check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "26.13.1"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Require Python 3.15
        run: python3 -c 'import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 15))'

      - name: Set up just
        uses: rknightion/.github/.github/actions/setup-just@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

      - name: just setup
        run: just setup

      - name: Require pinned runtime provenance and verify registry signatures
        # npm verifies attestations when present, but does not require every package to have one.
        # Require provenance for our direct runtime dependencies; transitives remain signature-only
        # unless they publish an attestation, in which case npm verifies it too.
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { dependencies } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { packages } = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [name, version] of Object.entries(dependencies)) {
            const installed = JSON.parse(readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            assert.equal(installed.version, version, `${name}: installed version differs from pin`);
            const dist = JSON.parse(execFileSync('npm', ['view', `${name}@${version}`, 'dist', '--json'], { encoding: 'utf8' }));
            assert.equal(dist.integrity, packages[`node_modules/${name}`].integrity, `${name}: registry integrity differs from lock`);
            assert.ok(dist.attestations?.url && dist.attestations?.provenance?.predicateType,
              `${name}@${version}: missing provenance attestation`);
            console.log(`${name}@${version}: provenance present; verifying with npm audit signatures`);
          }
          NODE
          npm audit signatures

      - name: Audit the shipped dependency tree
        run: just audit

      # The leak leg of `just check` runs in the leak-scan job, which holds the term list; a CI
      # checkout has no installed hooks to verify.
      - name: just fmt-check lint test
        run: just fmt-check lint test

  macos-test:
    name: just test (macOS)
    needs: changes
    if: needs.changes.outputs.macos != 'false'
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "26.13.1"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up just
        uses: rknightion/.github/.github/actions/setup-just@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

      - name: just setup
        run: just setup

      # Pull requests run only what differs by platform; main pushes and manual runs run it all.
      # The Linux job has already run the full suite on the same commit.
      - name: just test (full)
        if: github.event_name != 'pull_request'
        run: just test

      - name: just test-macos (platform-specific subset)
        if: github.event_name == 'pull_request'
        run: just test-macos

  history-scans:
    name: history-scans
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      # Fails closed: an unset or empty LEAK_TERMS secret exits 2.
      - name: Scan history and tree against the private term list
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: |
          python3 bin/leak-scan --history
          python3 bin/leak-scan --path .

      - name: Scan a fork pull request against the public patterns only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning title=leak-scan::Fork pull request: repository secrets are unavailable, so only the public patterns run. A maintainer re-runs the full scan before merging."
          python3 bin/leak-scan --public-only --history
          python3 bin/leak-scan --public-only --path .

      # Bump the version and the checksum together, copying the checksum from the release's own
      # trufflehog_<version>_checksums.txt asset; never type it by hand.
      - name: Install trufflehog
        env:
          TRUFFLEHOG_VERSION: "3.97.9"
          TRUFFLEHOG_LINUX_AMD64_SHA256: "40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866"
        run: |
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}"
          printf '%s  %s\n' "${TRUFFLEHOG_LINUX_AMD64_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/trufflehog"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trufflehog" trufflehog
          rm -f "${RUNNER_TEMP}/${archive}"

      - name: Scan the full history
        run: '"${RUNNER_TEMP}/trufflehog/trufflehog" git file://. --results=verified,unknown --fail --no-update'

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/actionlint.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

  # The single required check. It fails unless every gate above succeeded; macOS may be skipped
  # only when the changes job succeeded and decided that only README.md changed.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, just-check, macos-test, history-scans, actionlint, zizmor]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "${RESULTS}" | jq -e '
            . as $n
            | ($n.changes.result == "success")
              and ([$n["just-check"], $n["history-scans"], $n.actionlint, $n.zizmor] | all(.result == "success"))
              and ($n["macos-test"].result == "success"
                   or ($n["macos-test"].result == "skipped" and $n.changes.outputs.macos == "false"))
          ' > /dev/null
